apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pipeline-analyzer.fullname" . }}
  labels:
    {{- include "pipeline-analyzer.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pipeline-analyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart the pod when the collector configuration changes.
        checksum/collector-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pipeline-analyzer.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: pipeline-analyzer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Prometheus exporter of the collector sidecar.
            - name: METRICS_ENDPOINT
              value: http://localhost:8889/metrics
            - name: PORT
              value: "5000"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: otel-collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 8889
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otelcol
              readOnly: true
          {{- with .Values.collector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: collector-config
          configMap:
            name: {{ include "pipeline-analyzer.fullname" . }}-collector
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
