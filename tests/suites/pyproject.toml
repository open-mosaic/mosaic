[project]
name = "mosaic-tests"
version = "0.1.0"
description = "Mosaic integration test suite"
requires-python = ">=3.14"
dependencies = [
    "production-test-framework",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
python_files = "test_*.py"
python_functions = "test_*"
filterwarnings = [
    'ignore:This process .* is multi-threaded, use of fork\(\) may lead to deadlocks in the child:DeprecationWarning',
]

[tool.uv.sources]
production-test-framework = { git = "https://github.com/thurttdd/production-test-framework.git", branch = "tlh/EN-3488/support_scale_to_multi_gpu" }
