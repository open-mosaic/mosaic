[project]
name = "mosaic-tests"
version = "0.1.0"
description = "Mosaic integration test suite"
requires-python = ">=3.14"
dependencies = [
    "production-test-framework",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
log_cli = true
log_cli_level = "INFO"
python_files = "test_*.py"
python_functions = "test_*"
# Report sections, most specific first: a test is filed under the first one it carries.
report_category_markers = ["profiler_otel", "dashboards"]
filterwarnings = [
    'ignore:This process .* is multi-threaded, use of fork\(\) may lead to deadlocks in the child:DeprecationWarning',
]

[tool.uv.sources]
production-test-framework = { git = "https://github.com/open-mosaic/production-test-framework.git" }

[tool.ruff]
# The suite is written to 100 columns; without this ruff checks against its default of 88.
line-length = 100
